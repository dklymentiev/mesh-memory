<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesh -- Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg-body:    #1a1a1a;
  --bg-card:    #242424;
  --bg-accent:  #2e2e2e;
  --bg-dark:    #141414;
  --text:       #e0e0e0;
  --text-dim:   #999;
  --text-muted: #666;
  --border:     #333;
  --radius:     3px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--bg-body);
  color: var(--text);
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 14px;
  line-height: 1.5;
}
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px; background: var(--bg-dark);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.topbar .logo {
  font-size: 20px; font-weight: 700; color: var(--text);
  text-decoration: none; letter-spacing: 2px;
}
.topbar nav { display: flex; gap: 4px; }
.topbar nav a {
  padding: 4px 12px; border-radius: var(--radius);
  color: var(--text-dim); text-decoration: none; font-size: 13px;
  transition: background .15s, color .15s;
}
.topbar nav a:hover { background: var(--bg-accent); color: var(--text); }
.topbar nav a.active { background: var(--bg-accent); color: var(--text); }
.topbar .stats {
  margin-left: auto; display: flex; gap: 16px;
  font-size: 12px; color: var(--text-dim);
}
.topbar .stats span b { color: var(--text); }
.search-bar { display: flex; gap: 8px; padding: 16px 20px 8px; }
.search-bar input {
  flex: 1; padding: 10px 14px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text);
  font-family: inherit; font-size: 14px; outline: none;
  transition: border-color .2s;
}
.search-bar input:focus { border-color: var(--text-dim); }
.search-bar input::placeholder { color: var(--text-muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 20px; }
.chip {
  padding: 3px 10px; border: 1px solid var(--border);
  border-radius: 12px; font-size: 12px; color: var(--text-dim);
  cursor: pointer; transition: all .15s;
  background: transparent; font-family: inherit;
}
.chip:hover { border-color: var(--text-dim); color: var(--text); }
.chip.active { background: var(--bg-accent); border-color: var(--text-dim); color: var(--text); }
.results {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px; padding: 12px 20px 20px;
}
.results.empty-state {
  display: flex; justify-content: center;
  padding: 60px 20px; color: var(--text-muted); font-size: 13px;
}
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-left: 3px solid var(--text-muted); border-radius: var(--radius);
  padding: 12px; cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  opacity: 0; animation: fadeIn .3s ease forwards;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,.4); }
.card .card-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px; font-size: 11px;
}
.card .card-date { color: var(--text-muted); }
.card .card-score {
  background: rgba(170,170,170,.15); color: var(--text);
  padding: 1px 6px; border-radius: 2px; font-weight: 700;
}
.card .card-preview {
  font-size: 12px; color: var(--text-dim); line-height: 1.45;
  max-height: 100px; overflow: hidden; word-break: break-word;
}
.card .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.card .card-tags span {
  font-size: 10px; padding: 1px 6px; border-radius: 2px;
  background: var(--bg-accent); color: var(--text-muted);
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card[data-type="worklog"]    { border-left-color: #7a9f7a; }
.card[data-type="note"]       { border-left-color: #c4b870; }
.card[data-type="decision"]   { border-left-color: #a878a8; }
.card[data-type="task"]       { border-left-color: #8a8a8a; }
.card[data-type="artifact"]   { border-left-color: #c09060; }
.card[data-type="research"]   { border-left-color: #80a098; }
.card[data-type="rfc"]        { border-left-color: #c07070; }
.card[data-type="discussion"] { border-left-color: #8070a0; }
.card[data-type="idea"]       { border-left-color: #c0a860; }
.panel-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.5); z-index: 200;
}
.panel-overlay.open { display: block; }
.panel {
  position: fixed; top: 0; right: 0;
  width: min(900px, 90vw); height: 100vh;
  background: var(--bg-card); border-left: 1px solid var(--border);
  z-index: 201; display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .25s ease;
}
.panel.open { transform: translateX(0); }
.panel-header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; background: var(--bg-accent);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.panel-header .panel-date { color: var(--text-muted); font-size: 12px; }
.panel-header .panel-guid { color: var(--text-dim); font-size: 12px; }
.panel-header .panel-close {
  margin-left: auto; background: none; border: none;
  color: var(--text-dim); font-size: 18px; cursor: pointer; font-family: inherit;
}
.panel-header .panel-close:hover { color: var(--text); }
.panel-tags {
  display: flex; flex-wrap: wrap; gap: 4px;
  padding: 8px 16px; border-bottom: 1px solid var(--border);
}
.panel-tags span {
  font-size: 11px; padding: 2px 8px; border-radius: 2px;
  background: var(--bg-accent); color: var(--text-dim);
}
.panel-body { flex: 1; overflow-y: auto; padding: 16px; }
.markdown-body { color: var(--text); line-height: 1.7; }
.markdown-body h1, .markdown-body h2, .markdown-body h3 { color: var(--text); margin: 16px 0 8px; }
.markdown-body h1 { font-size: 18px; }
.markdown-body h2 { font-size: 16px; }
.markdown-body h3 { font-size: 14px; }
.markdown-body p { margin: 8px 0; }
.markdown-body code { background: var(--bg-dark); padding: 2px 5px; border-radius: 2px; font-size: 13px; }
.markdown-body pre { background: var(--bg-dark); padding: 12px; border-radius: var(--radius); overflow-x: auto; margin: 10px 0; }
.markdown-body pre code { background: none; padding: 0; }
.markdown-body a { color: var(--text-dim); text-decoration: underline; }
.markdown-body ul, .markdown-body ol { padding-left: 20px; margin: 8px 0; }
.markdown-body table { border-collapse: collapse; width: 100%; margin: 10px 0; }
.markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
.markdown-body th { background: var(--bg-accent); }
.markdown-body blockquote { border-left: 3px solid var(--text-muted); padding-left: 12px; color: var(--text-dim); margin: 8px 0; }
.markdown-body img { max-width: 100%; border-radius: var(--radius); }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-body); }
::-webkit-scrollbar-thumb { background: var(--bg-accent); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #444; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <a class="logo" href="/ui/">MESH</a>
  <nav>
    <a href="/ui/" class="active">Search</a>
    <a href="/ui/map.html">Map</a>
  </nav>
  <div class="stats">
    <span>docs: <b id="st-docs">--</b></span>
    <span>indexed: <b id="st-idx">--</b></span>
    <span>tags: <b id="st-tags">--</b></span>
  </div>
</div>

<!-- Search -->
<div class="search-bar">
  <input id="q" type="text" placeholder="Semantic search..." autofocus>
</div>

<!-- Type filter chips -->
<div class="chips" id="chips"></div>

<!-- Status line -->
<div id="status" style="padding:2px 20px;font-size:11px;color:#666;min-height:16px;"></div>

<!-- Results grid -->
<div class="results empty-state" id="results">Type a query to search</div>

<!-- Slide-out panel -->
<div class="panel-overlay" id="overlay"></div>
<div class="panel" id="panel">
  <div class="panel-header">
    <span class="panel-date" id="p-date"></span>
    <span class="panel-guid" id="p-guid"></span>
    <button class="panel-close" id="p-close">[x]</button>
  </div>
  <div class="panel-tags" id="p-tags"></div>
  <div class="panel-body markdown-body" id="p-body"></div>
</div>

<script>
const API = window.location.origin;
const CHIP_TYPES = ['worklog','note','decision','task','artifact','research','rfc','discussion','idea'];

let activeChip = null;
let searchGen = 0;
let debounceTimer = null;

// ---- Init ----
document.addEventListener('DOMContentLoaded', () => {
  loadStats();
  buildChips();
  const params = new URLSearchParams(location.search);
  if (params.get('guid')) openDocByGuid(params.get('guid'));
  if (params.get('q')) {
    document.getElementById('q').value = params.get('q');
    doSearch();
  }
});

// ---- Stats ----
async function loadStats() {
  try {
    const r = await fetch(API + '/stats');
    const d = await r.json();
    document.getElementById('st-docs').textContent = d.documents;
    document.getElementById('st-idx').textContent = d.indexed;
    document.getElementById('st-tags').textContent = d.tags;
  } catch(e) {}
}

// ---- Chips ----
function buildChips() {
  const box = document.getElementById('chips');
  CHIP_TYPES.forEach(t => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = t;
    b.onclick = () => toggleChip(b, t);
    box.appendChild(b);
  });
}
function toggleChip(el, type) {
  if (activeChip === type) {
    activeChip = null;
    el.classList.remove('active');
  } else {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    activeChip = type;
    el.classList.add('active');
  }
  doSearch();
}

// ---- Search: semantic with debounce on input, immediate on Enter ----
const qInput = document.getElementById('q');

qInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = qInput.value.trim();
  if (!q) {
    searchGen++;
    document.getElementById('results').className = 'results empty-state';
    document.getElementById('results').textContent = 'Type a query to search';
    document.getElementById('status').textContent = '';
    return;
  }
  document.getElementById('status').textContent = 'Waiting...';
  debounceTimer = setTimeout(doSearch, 500);
});

qInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    clearTimeout(debounceTimer);
    doSearch();
  }
});

async function doSearch() {
  const q = qInput.value.trim();
  if (!q) return;
  const gen = ++searchGen;
  const status = document.getElementById('status');
  const grid = document.getElementById('results');

  const url = new URL(location);
  url.searchParams.set('q', q);
  history.replaceState(null, '', url);

  const t0 = performance.now();
  const timer = setInterval(() => {
    if (gen !== searchGen) { clearInterval(timer); return; }
    status.textContent = 'Searching... ' + Math.round(performance.now() - t0) + 'ms';
  }, 47);

  try {
    const body = { query: q, limit: 30 };
    if (activeChip) body.tags = ['type:' + activeChip];
    const r = await fetch(API + '/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await r.json();
    clearInterval(timer);
    if (gen !== searchGen) return; // stale
    const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
    const results = data.results || [];
    status.textContent = results.length + ' results in ' + elapsed + 's';
    renderCards(results);
  } catch(e) {
    clearInterval(timer);
    if (gen === searchGen) {
      status.textContent = 'Search failed: ' + e.message;
    }
  }
}

// ---- Render cards ----
function renderCards(docs) {
  const grid = document.getElementById('results');
  if (!docs.length) {
    grid.className = 'results empty-state';
    grid.textContent = 'No results found';
    return;
  }
  grid.className = 'results';
  grid.innerHTML = '';
  docs.forEach((doc, i) => {
    const type = extractType(doc.tags);
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.type = type;
    card.style.animationDelay = (i * 30) + 'ms';
    card.onclick = () => openDocByGuid(doc.guid);

    const date = doc.created_at ? new Date(doc.created_at).toLocaleDateString('en-CA') : '--';
    const score = doc.similarity_score != null ? doc.similarity_score.toFixed(3) : '';
    const preview = (doc.content || '').slice(0, 300).replace(/</g, '&lt;');
    const tags = doc.tags || [];
    const tagsHtml = tags.slice(0, 4).map(t =>
      '<span>' + t.replace(/</g, '&lt;') + '</span>'
    ).join('');
    const moreCount = tags.length - 4;

    card.innerHTML =
      '<div class="card-head">' +
        '<span class="card-date">' + date + '</span>' +
        (score ? '<span class="card-score">' + score + '</span>' : '') +
      '</div>' +
      '<div class="card-preview">' + preview + '</div>' +
      '<div class="card-tags">' + tagsHtml +
        (moreCount > 0 ? '<span>+' + moreCount + '</span>' : '') +
      '</div>';
    grid.appendChild(card);
  });
}

function extractType(tags) {
  if (!tags) return 'unknown';
  for (const t of tags) {
    if (t.startsWith('type:')) return t.slice(5);
  }
  return 'unknown';
}

// ---- Document panel ----
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');

overlay.addEventListener('click', closePanel);
document.getElementById('p-close').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

async function openDocByGuid(guid) {
  try {
    const r = await fetch(API + '/' + guid);
    if (!r.ok) return;
    const doc = await r.json();
    document.getElementById('p-date').textContent = doc.created_at ? new Date(doc.created_at).toLocaleString() : '';
    document.getElementById('p-guid').textContent = doc.guid || '';
    document.getElementById('p-tags').innerHTML = (doc.tags || []).map(t =>
      '<span>' + t.replace(/</g, '&lt;') + '</span>'
    ).join('');
    document.getElementById('p-body').innerHTML = marked.parse(doc.content || '');
    const url = new URL(location);
    url.searchParams.set('guid', doc.guid);
    history.replaceState(null, '', url);
    overlay.classList.add('open');
    panel.classList.add('open');
  } catch(e) { console.warn('Failed to load doc', e); }
}

function closePanel() {
  overlay.classList.remove('open');
  panel.classList.remove('open');
  const url = new URL(location);
  url.searchParams.delete('guid');
  history.replaceState(null, '', url);
}
</script>
</body>
</html>
